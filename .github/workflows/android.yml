name: Android CI

on:
  push:
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/proot-runtime.yml"
  pull_request:
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-proot:
    name: Build bundled PRoot runtimes
    uses: ./.github/workflows/proot-runtime.yml
    permissions:
      contents: read

  assemble:
    name: Assemble Android debug APK
    needs: build-proot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download PRoot ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: proot-*
          path: runtime-artifacts
          merge-multiple: false

      - name: Package verified PRoot binaries as APK assets
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            archive="runtime-artifacts/proot-$abi/proot-$abi.zip"
            test -s "$archive"
            destination="android/app/src/main/assets/runtime/$abi"
            mkdir -p "$destination"
            unzip -p "$archive" "proot-$abi/proot" > "$destination/proot"
            chmod 755 "$destination/proot"
            sha256sum "$destination/proot" | awk '{print $1}' > "$destination/proot.sha256"
            test -s "$destination/proot"
            test "$(wc -c < "$destination/proot")" -gt 50000
          done
          unzip -p runtime-artifacts/proot-arm64-v8a/proot-arm64-v8a.zip proot-arm64-v8a/COPYING-PROOT > android/app/src/main/assets/runtime/COPYING-PROOT
          sha256sum android/app/src/main/assets/runtime/arm64-v8a/proot android/app/src/main/assets/runtime/x86_64/proot

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Rust Android libraries
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p distroboxer-engine

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :android:app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DistroBoxer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
