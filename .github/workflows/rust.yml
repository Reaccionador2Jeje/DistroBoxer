name: Rust CI

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  check:
    name: Format, check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format Rust sources on same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style(rust): apply rustfmt"
            git push origin "HEAD:$PR_HEAD_REF"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/rust.yml/dispatches" -f ref="$PR_HEAD_REF"
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace
