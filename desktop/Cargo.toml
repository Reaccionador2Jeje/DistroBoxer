[package]
name = "distroboxer-desktop"
version = "0.3.0"
description = "DistroBoxer Linux distribution manager"
authors = ["Atdev Dev"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = "0.45"
tiny-skia = "0.11"

[dependencies]
distroboxer-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
portable-pty = "0.9"
